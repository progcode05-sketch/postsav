<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Segoe UI","Inter",Arial,sans-serif;color:#0f1a3a;background:radial-gradient(760px 520px at 88% -6%,#cfe0ff 0,transparent 70%),radial-gradient(640px 460px at -4% 8%,#e1ebff 0,transparent 66%),linear-gradient(#f8fbff,#eef4ff);position:relative}
.brand{position:absolute;left:70px;top:58px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;letter-spacing:-.02em}
.brand svg{width:60px;height:60px}
h1{position:absolute;left:70px;top:178px;width:640px;font-size:70px;line-height:1.04;letter-spacing:-.045em;font-weight:800}
h1 .soft{color:#76829f}h1 .hi{color:#2f6bff}
p.sub{position:absolute;left:70px;top:470px;width:600px;font-size:28px;line-height:1.35;color:#5a6684}
.pills{position:absolute;left:70px;top:556px;display:flex;gap:12px}
.pill{padding:9px 20px;border-radius:999px;background:#fff;border:1px solid #dfe8f7;font-size:21px;font-weight:600;color:#1f4fd6}
.orb{position:absolute;right:-60px;top:70px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#dce8ff 38%,#bcd2ff 72%,#a9c3ff 100%);opacity:.92}
.card{position:absolute;display:flex;align-items:center;gap:18px;padding:22px 26px;background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:30px;box-shadow:0 28px 60px -22px rgba(32,64,160,.45)}
.card b{display:block;font-size:27px;letter-spacing:-.01em}.card small{display:block;color:#5a6684;font-size:20px}
.ic{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;flex:none}
.ig{background:linear-gradient(135deg,#f9a03f,#e1306c 55%,#7b3fe4)}.li{background:#0a66c2}.pin{background:#e60023}
.chk{width:34px;height:34px;border-radius:50%;background:rgba(26,168,107,.15);color:#1aa86b;display:grid;place-items:center;font-weight:800;font-size:19px}
.c1{right:56px;top:84px}.c2{right:28px;top:262px}.c3{right:84px;top:440px}
</style></head>
<body>
<div class="brand"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="10" fill="url(#g)"/><path d="M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M9.5 23h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="4" y1="2" x2="28" y2="30"><stop stop-color="#6a95ff"/><stop offset="1" stop-color="#2f5bf0"/></linearGradient></defs></svg>PostSav</div>
<h1><span class="soft">Free Instagram, LinkedIn &amp; Pinterest</span> <span class="hi">post downloader</span></h1>
<p class="sub">Save images, videos and carousel slides from public posts. No sign-up, nothing stored.</p>
<div class="pills"><span class="pill">Images</span><span class="pill">Videos</span><span class="pill">Carousels</span><span class="pill">ZIP</span></div>
<div class="orb"></div>
<div class="card c1"><span class="ic ig">IG</span><div><b>Instagram Reel</b><small>Video · ready to save</small></div><span class="chk">✓</span></div>
<div class="card c2"><span class="ic li">in</span><div><b>LinkedIn carousel</b><small>12 slides · ready</small></div><span class="chk">✓</span></div>
<div class="card c3"><span class="ic pin">P</span><div><b>Pinterest pin</b><small>Original size · ready</small></div><span class="chk">✓</span></div>
</body></html>
