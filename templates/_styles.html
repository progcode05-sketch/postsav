<style>
:root{--bg:#f4f8ff;--surface:#fff;--ink:#0f1a3a;--muted:#5a6684;--line:#dfe8f7;--soft:#eaf1ff;--accent:#2f6bff;--accent-2:#5b8cff;--accent-ink:#1f4fd6;--ok:#1aa86b;--warn:#8a5a00;--err:#c73a3a;--shadow:0 1px 2px rgba(23,45,105,.05),0 12px 32px -12px rgba(47,107,255,.22);--radius:18px;--font:"Inter","Segoe UI",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 var(--font);background:radial-gradient(900px 520px at 85% -8%,#d6e4ff 0,transparent 70%),radial-gradient(700px 480px at -5% 12%,#e3ecff 0,transparent 65%),linear-gradient(#f8fbff,#f1f6ff 55%,#f8fbff);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}a:hover{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:12px;z-index:20;margin:12px auto 0;max-width:1120px;padding:0 24px}
.nav-in{display:flex;align-items:center;gap:20px;padding:10px 12px 10px 18px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(223,232,247,.9);border-radius:999px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.nav-links{display:flex;gap:6px;margin-left:auto;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px}
.nav-links a:hover{background:var(--soft);color:var(--ink)}
.nav-links a[aria-current]{color:var(--ink);background:var(--soft)}
.nav-links .pill{background:var(--ink);color:#fff}.nav-links .pill:hover{background:#1c2b57;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;font:600 15px var(--font);cursor:pointer;box-shadow:0 8px 20px -8px rgba(47,107,255,.65),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:10px 16px;font-size:14px}
:focus-visible{outline:3px solid rgba(47,107,255,.45);outline-offset:2px}
footer.site{margin-top:88px;padding:36px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer.site .cols{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-start}
footer.site p{margin:4px 0;max-width:620px}footer.site nav{display:flex;gap:18px;flex-wrap:wrap}footer.site a{color:var(--muted);text-decoration:none}footer.site a:hover{color:var(--accent)}
@media(max-width:700px){.wrap{padding:0 16px}.nav{padding:0 12px;top:8px}.nav-links a:not(.keep){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
